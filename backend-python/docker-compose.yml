services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dataplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dataplate_local
    ports:
      - "5433:5432"
    volumes:
      - dataplate_postgres_data:/var/lib/postgresql/data
      - ./db/init/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataplate"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: dataplate_local
    volumes:
      - ../database/migrations:/migrations:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "dataplate", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_mesa_reserva.sql", "-f", "/migrations/002_usuario_ativo.sql", "-f", "/migrations/002_mesa_qr_code_token.sql", "-f", "/migrations/003_password_reset_tokens.sql", "-f", "/migrations/004_usuario_email.sql", "-f", "/migrations/005_normalize_user_cpf.sql"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PORT: 8081
      DB_NAME: dataplate
      DB_USER: postgres
      DB_PASSWORD: dataplate_local
      JWT_SECRET: DataPlateJwtSecretKeyForDevelopmentOnlyChangeMe123456789
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      DEFAULT_TEST_USERS_ENABLED: "true"
      PASSWORD_RESET_DEBUG_CODE: "false"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost,capacitor://localhost
      # Permite somente navegadores na rede privada consumirem o frontend local na porta 5500.
      ALLOWED_ORIGIN_REGEX: '^http://(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2}):5500$'
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dataplate_postgres_data:
