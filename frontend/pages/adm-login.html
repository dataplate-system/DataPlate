<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>DataPlate - Login Administrativo</title>
  <link rel="icon" href="../images/brand/logo-dataplate.png" />
  <link rel="stylesheet" href="../Css/adm-login.css" />
  <link rel="stylesheet" href="../Css/design-system.css?v=20260910-unified" />
  <link rel="stylesheet" href="../Css/responsive.css?v=20261005-mobile-mesas" />
  <link rel="stylesheet" href="../Css/mobile.css?v=1" />
  <link rel="stylesheet" href="../Css/brand.css?v=20261005-orange-brand" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <script src="../JavaScript/mobile-runtime.js?v=1"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-label="Login do administrador">
      <div class="login-card">
        <div class="dataplate-brand login-brand">
          <span class="dataplate-brand-name">DataPlate</span>
          <span class="dataplate-brand-mark" aria-hidden="true">
            <img src="../images/brand/logo-dataplate.png" alt="" />
          </span>
        </div>
        <div class="login-card-header">
          <h1>Painel de Controle</h1>
        </div>

        <form id="adminLoginForm" novalidate>
          <div class="form-group">
            <label for="adminCpf">CPF</label>
            <input id="adminCpf" name="cpf" type="text" value="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="off" required />
          </div>

          <div class="form-group">
            <label for="adminPassword">Senha</label>
            <div class="password-field">
              <input id="adminPassword" name="password" type="password" value="admin123" autocomplete="current-password" minlength="6" required />
              <button type="button" id="togglePassword" aria-label="Mostrar senha">Mostrar</button>
            </div>
          </div>

          <div class="login-options-row">
            <label class="remember-row">
              <input type="checkbox" name="remember" checked />
              <span>Manter acesso neste navegador</span>
            </label>
            <a class="forgot-password-link" href="adm-recuperar-senha.html">Esqueci minha senha</a>
          </div>

          <p class="login-error" id="loginError" role="alert"></p>

          <button class="login-button" type="submit">Entrar</button>
        </form>
      </div>
    </section>
  </main>

  <script src="../JavaScript/adm-auth.js" defer></script>
  <script src="../JavaScript/adm-login.js" defer></script>
</body>
</html>
