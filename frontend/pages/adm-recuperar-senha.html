<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>DataPlate - Recuperar Senha</title>
  <link rel="icon" href="../images/brand/logo-dataplate.png" />
  <link rel="stylesheet" href="../Css/design-system.css?v=20260910-unified" />
  <link rel="stylesheet" href="../Css/mobile.css?v=1" />
  <link rel="stylesheet" href="../Css/admin-login.css" />
  <link rel="stylesheet" href="../Css/adm-recuperar-senha.css" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <script src="../JavaScript/mobile-runtime.js?v=1"></script>
</head>
<body class="login-page">
  <main class="admin-login-page reset-password-page">
    <section class="admin-login-card reset-card" aria-label="Recuperação de senha administrativa">
      <a class="admin-login-brand" href="index.html" aria-label="DataPlate - início">
        <img src="../images/brand/logo-dataplate.png" alt="DataPlate" height="64" width="86" />
        <span>DataPlate</span>
      </a>

      <header class="admin-login-header">
        <h1>Recuperar senha</h1>
        <p>Informe seu CPF para recuperar o acesso ao painel.</p>
      </header>

        <ol class="reset-steps" aria-label="Etapas da recuperação">
          <li class="is-active" data-step="identify">CPF</li>
          <li data-step="code">Código</li>
          <li data-step="password">Nova senha</li>
        </ol>

        <form id="identifyCpfForm" class="reset-step-panel" data-step-panel="identify" novalidate>
          <div class="form-group">
            <label for="recoveryCpf">CPF cadastrado</label>
            <input id="recoveryCpf" name="cpf" type="text" value="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="off" required />
          </div>

          <button class="login-button" type="submit">Continuar verificação</button>
        </form>

        <form id="securityCodeForm" class="reset-step-panel" data-step-panel="code" novalidate hidden>
          <div class="security-code-box">
            <span>Código de segurança</span>
            <strong id="resetCodePreview" hidden></strong>
            <small id="resetCodeHint">Solicite um código para continuar.</small>
          </div>

          <div class="form-group">
            <label for="securityCode">Digite o código recebido</label>
            <input id="securityCode" name="securityCode" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required />
          </div>

          <button class="login-button" type="submit">Validar código</button>
          <button class="secondary-link-button" type="button" id="resendSecurityCode">Enviar código</button>
        </form>

        <form id="newPasswordForm" class="reset-step-panel" data-step-panel="password" novalidate hidden>
          <div class="form-group">
            <label for="newAdminPassword">Nova senha</label>
            <input id="newAdminPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>

          <div class="form-group">
            <label for="confirmAdminPassword">Confirmar nova senha</label>
            <input id="confirmAdminPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />
          </div>

          <label class="remember-row security-confirmation">
            <input type="checkbox" name="confirmOwnership" required />
            <span>Confirmo que a troca foi solicitada pelo titular deste acesso.</span>
          </label>

          <button class="login-button" type="submit">Atualizar senha</button>
        </form>

      <p class="login-error" id="resetMessage" role="alert"></p>

      <a class="back-login-link" href="adm-login.html">Voltar ao login</a>
      <p class="admin-login-help">Acesso seguro à gestão do seu restaurante.</p>
    </section>
  </main>

  <script src="../JavaScript/adm-auth.js" defer></script>
  <script src="../JavaScript/adm-recuperar-senha.js?v=20261026-password-reset-api" defer></script>
</body>
</html>
